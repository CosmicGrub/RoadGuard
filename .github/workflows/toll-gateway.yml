name: Toll gateway CI
on:
  pull_request:
    paths: ['backend/toll-gateway/**','.github/workflows/toll-gateway.yml']
  push:
    branches: [main]
    paths: ['backend/toll-gateway/**','.github/workflows/toll-gateway.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test backend/toll-gateway/server.test.js
